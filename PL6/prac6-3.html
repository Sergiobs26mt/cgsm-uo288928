<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 6 - Ejercicio 3</title>
    <link rel="stylesheet" href="prac6-3.css">
</head>

<body>
    <div id="container">

        <!-- The element where local video is played -->
        <video id="localVideo" autoplay="true" muted="true"></video>

        <!-- The element where remote video is played -->
        <video id="remoteVideo" autoplay="true"></video>

        <div>
            <!-- Buttons for call control -->
            <button id="startButton" disabled="true">Iniciar</button>
            <button id="callButton" disabled="true">Llamar</button>
            <button id="hangupButton" disabled="true">Colgar</button>
        </div>

    </div>
    <script src="prac6-3.js"></script>
</body>

</html>
